name: Daily Content Generation

on:
  # schedule:
  #   # KST 07:00 = UTC 22:00
  #   - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      post_count:
        description: '생성할 포스트 수'
        required: false
        default: '2'

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      SEARCHAPI_API_KEY: ${{ secrets.SEARCHAPI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send start notification
        if: always()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="🚀 <b>쉬운재테크 블로그</b>%0A%0A콘텐츠 자동 생성을 시작합니다.%0A📝 목표: ${{ github.event.inputs.post_count || '5' }}개 포스트%0A🌐 https://www.easyzetec.com"

      - name: Generate blog posts
        id: generate
        run: npx tsx scripts/generate-seo-post.ts
        env:
          POST_COUNT: ${{ github.event.inputs.post_count || '5' }}

      # content-refiner 스텝 제거 (2026-07-29).
      # 제목에 "완벽 가이드"·"0원으로" 같은 파워워드를 쓰라고 지시하는 스크립트라
      # 생성 프롬프트의 제목 규칙·발행 게이트의 가격 주장 검사와 정면으로 충돌한다.
      # content/ 전체를 순회하며 재작성하므로 게이트 통과 글까지 다시 쓴다. 제거가 정공법이다.

      - name: Optimize internal links
        if: steps.generate.outputs.POST_COUNT != '0'
        run: npx tsx scripts/internal-linker.ts
        continue-on-error: true

      - name: Generate images
        if: steps.generate.outputs.POST_COUNT != '0'
        run: npx tsx scripts/generate-images.ts

      # 발행 게이트 — internal-linker 뒤, generate-images 뒤, git add 앞.
      # generate-images 뒤여야 하는 이유: 봇 신규글의 frontmatter image 는
      # /images/<slug>.png 를 가리키는데 그 파일을 이 스텝이 만든다. 앞에 두면
      # 전 신규글이 broken-image 로 격리된다.
      # continue-on-error 를 붙이지 말 것 — 붙이면 fail-closed 가 무의미해진다.
      - name: Publish Gate
        if: steps.generate.outputs.POST_COUNT != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/publish-gate.ts

      - name: Generate sitemap
        run: npx tsx scripts/generate-sitemap.ts

      - name: Generate RSS feed
        run: npx tsx scripts/generate-rss.ts

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "feat: 자동 생성 콘텐츠 (${{ steps.generate.outputs.POST_COUNT || '0' }}개 포스트)

          생성된 포스트: ${{ steps.generate.outputs.POST_SLUGS || 'none' }}"
          git push

      - name: Trigger Cloudflare Pages deploy
        if: steps.generate.outputs.POST_COUNT != '0'
        continue-on-error: true
        run: |
          curl -s -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"
          echo "Cloudflare Pages deploy triggered"

      - name: Ping Google Sitemap
        if: steps.generate.outputs.POST_COUNT != '0'
        continue-on-error: true
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://www.easyzetec.com/sitemap.xml"
          echo "Sitemap ping sent to Google"

      - name: Send success notification
        if: success()
        continue-on-error: true
        run: |
          POST_SLUGS="${{ steps.generate.outputs.POST_SLUGS }}"
          POST_COUNT="${{ steps.generate.outputs.POST_COUNT }}"

          if [ -z "$POST_SLUGS" ]; then
            MSG="✅ <b>[쉬운재테크] 자동화 완료</b>%0A새로 생성된 포스트가 없습니다."
          else
            LINKS=""
            IFS=',' read -ra SLUGS <<< "$POST_SLUGS"
            for i in "${!SLUGS[@]}"; do
              NUM=$((i + 1))
              LINKS="${LINKS}%0A${NUM}. https://www.easyzetec.com/blog/${SLUGS[$i]}"
            done
            MSG="✅ <b>[쉬운재테크] ${POST_COUNT}개 포스트 발행 완료!</b>${LINKS}"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            --data-urlencode "text=${MSG}"

      - name: Send failure notification
        if: failure()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>콘텐츠 생성 실패!</b>%0A%0A🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}%0A🌐 https://www.easyzetec.com"
